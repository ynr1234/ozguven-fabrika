<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pazar Mesaisi Bildirimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // MATRIX EASTER EGG (ÖMER FARUK YANAR) İÇİN FONKSİYON
        function baslatMatrix() {
            // Arka planı siyaha çevir ve kutuyu saydamlaştır
            document.body.className = "bg-black overflow-hidden relative w-full h-screen flex items-center justify-center";
            var anaKutu = document.getElementById('anaKutu');
            anaKutu.style.background = "transparent";
            anaKutu.style.border = "none";
            anaKutu.style.boxShadow = "none";

            // 1. ADIM: Ekranda ne varsa parçalayarak sağa sola fırlat
            var elemanlar = document.querySelectorAll('#anaKutu h1, #anaKutu p, #anaKutu label, #anaKutu select, #anaKutu input, #anaKutu button, .mb-4');
            elemanlar.forEach(function(el) {
                el.style.transition = "all 2s cubic-bezier(0.25, 1, 0.5, 1)";
                el.style.position = "relative";
                // Rastgele X, Y ekseni ve Dönme (Rotation) açısı hesapla
                var x = (Math.random() - 0.5) * 2500;
                var y = (Math.random() - 0.5) * 2500;
                var rot = (Math.random() - 0.5) * 1080;
                
                el.style.transform = "translate(" + x + "px, " + y + "px) rotate(" + rot + "deg) scale(0)";
                el.style.opacity = "0";
                el.style.pointerEvents = "none";
            });

            // 2. ADIM: Matrix Akan Yazı (Digital Rain) Efektini Başlat
            var canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.zIndex = '0';
            document.body.appendChild(canvas);
            
            var ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';
            letters = letters.split('');
            var fontSize = 16;
            var columns = canvas.width / fontSize;
            var drops = [];
            for (var i = 0; i < columns; i++) {
                drops[i] = 1;
            }
            
            setInterval(function() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = fontSize + 'px monospace';
                
                for (var i = 0; i < drops.length; i++) {
                    var text = letters[Math.floor(Math.random() * letters.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }, 33);

            // 3. ADIM: Ekrana Hoş Geldin Mesajı Çıkar
            setTimeout(function() {
                var msg = document.createElement('div');
                msg.innerHTML = "<h1 class='text-4xl md:text-6xl font-black text-green-500 mb-4 tracking-widest' style='text-shadow: 0 0 20px #0f0;'>SİSTEME ERİŞİLDİ</h1><p class='text-green-400 text-xl font-mono'>Hoş Geldin Kurucu, Ömer Faruk YANAR.</p><button onclick='window.location.reload()' class='mt-8 bg-green-900 border border-green-500 text-green-400 px-6 py-2 rounded font-mono hover:bg-green-700 transition'>Sistemi Normale Döndür</button>";
                msg.style.position = 'fixed';
                msg.style.top = '50%';
                msg.style.left = '50%';
                msg.style.transform = 'translate(-50%, -50%)';
                msg.style.zIndex = '50';
                msg.style.textAlign = 'center';
                document.body.appendChild(msg);
            }, 1800);
        }

        // ANA FORM KONTROLÜ
        function formKontrol(durumSecimi) {
            var form = document.getElementById('mesaiForm');
            var ad_soyad = document.getElementById('ad_soyad').value;
            var sicil_no = document.getElementById('girilen_sicil').value;
            var mazeret = document.getElementById('mazeret');
            var durumInput = document.getElementById('durum_input');

            // --- EASTER EGG 1: MUSTAFA YANAR (GİF) ---
            if (ad_soyad.toUpperCase() === 'MUSTAFA YANAR' && sicil_no === '1994' && durumSecimi === 'GELİYOR') {
                document.getElementById('anaKutu').style.display = 'none';
                document.getElementById('easterEggKutusu').style.display = 'block';
                return;
            }

            // --- EASTER EGG 2: ÖMER FARUK YANAR (MATRIX + PATLAMA) ---
            // '0477' veya '477' girilme ihtimaline karşı iki durumu da kabul ediyoruz.
            if (ad_soyad.toUpperCase() === 'ÖMER FARUK YANAR' && (sicil_no === '0477' || sicil_no === '477')) {
                baslatMatrix();
                return; 
            }

            // Standart Doğrulamalar
            if (!ad_soyad) {
                alert("Lütfen listeden isminizi seçiniz.");
                return;
            }
            if (!sicil_no) {
                alert("Lütfen sicil numaranızı giriniz.");
                return;
            }
            if (durumSecimi === 'GELMİYOR' && mazeret.value.trim() === '') {
                alert("Gelmeyeceğinizi belirttiniz. Lütfen mazeretinizi doldurunuz.");
                mazeret.focus();
                return;
            }

            durumInput.value = durumSecimi;
            form.submit();
        }
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 transition-colors duration-1000">

    <!-- NORMAL MESAİ FORMU KUTUSU -->
    <div id="anaKutu" class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md border border-slate-200 transition-all duration-1000">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-800">Pazar Mesaisi Bildirimi</h1>
            <p class="text-sm text-slate-500 mt-1">Lütfen kimliğinizi doğrulayıp seçiminizi yapın</p>
        </div>

        {% if mesaj %}
        <div class="mb-4 p-3 rounded-lg text-center font-semibold text-sm 
            {% if hata %} bg-rose-100 text-rose-800 border border-rose-300
            {% elif durum == 'GELİYOR' %} bg-emerald-100 text-emerald-800 border border-emerald-300
            {% else %} bg-amber-100 text-amber-800 border border-amber-300 {% endif %}">
            {{ mesaj }}
        </div>
        {% endif %}

        <form id="mesaiForm" action="/bildir" method="POST" class="space-y-4">
            <input type="hidden" name="durum" id="durum_input" value="">
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">1. Personel Seçimi</label>
                <select name="ad_soyad" id="ad_soyad" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 text-sm bg-white transition-all">
                    <option value="" disabled selected>İsminizi listeden seçiniz...</option>
                    {% for kisi in personeller %}
                    <option value="{{ kisi }}">{{ kisi }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">2. Sicil Numaranız (Şifre)</label>
                <input type="text" pattern="[0-9]*" inputmode="numeric" name="girilen_sicil" id="girilen_sicil" required placeholder="Sicil No Giriniz" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 text-base transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">3. Mazeret (Gelmeyenler İçin Zorunlu)</label>
                <input type="text" name="mazeret" id="mazeret" placeholder="Gelemiyorsanız nedenini yazınız" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500 text-slate-800 text-sm transition-all">
            </div>

            <div class="pt-2">
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Pazar Günü Durumunuz</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="formKontrol('GELİYOR')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md transition-all active:scale-95 flex flex-col items-center justify-center">
                        <span class="text-lg">✓</span>
                        <span>GELİYORUM</span>
                    </button>
                    <button type="button" onclick="formKontrol('GELMİYOR')" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 rounded-xl shadow-md transition-all active:scale-95 flex flex-col items-center justify-center">
                        <span class="text-lg">✕</span>
                        <span>GELEMİYORUM</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- EASTER EGG GİZLİ KUTUSU (MUSTAFA YANAR İÇİN) -->
    <div id="easterEggKutusu" style="display: none;" class="bg-black p-6 rounded-2xl shadow-2xl w-full max-w-md border-4 border-yellow-500 text-center animate-pulse">
        <h1 class="text-3xl font-black text-yellow-400 mb-6 uppercase tracking-widest">SELAM SANA İMPARATOR</h1>
        
        <div class="w-full bg-white rounded-lg overflow-hidden mb-4">
            <div class="tenor-gif-embed" data-postid="962526223077777279" data-share-method="host" data-aspect-ratio="0.562249" data-width="100%">
                <a href="https://tenor.com/view/selam-sana-imparator-gif-962526223077777279">Selam Sana Imparator GIF</a>
            </div> 
            <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        </div>
        
        <button onclick="window.location.reload()" class="mt-4 bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-6 rounded-full transition-all">
            Emrinize Amadeyim (Geri Dön)
        </button>
    </div>

</body>
</html>
