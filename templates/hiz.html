<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özgüven Kablo | Canlı Hat Hızı Girişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6 font-sans">
    <div class="max-w-xl mx-auto">

        <!-- ÜST BAR -->
        <div class="flex justify-between items-center mb-4">
            <a href="/" class="text-sm font-bold text-slate-600 hover:text-slate-900">← Ana Menü</a>
            <span class="text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-800">⚡ Saha Hız Takibi</span>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
            <h1 class="text-xl font-extrabold text-slate-800 mb-1">Hat Hızı Bildirim Formu</h1>
            <p class="text-xs text-slate-500 mb-5">Makine, operasyon ve mamül seçerek güncel hat hızını giriniz.</p>

            {% if mesaj %}
            <div class="mb-5 p-3.5 rounded-xl text-sm font-bold {{ 'bg-red-50 text-red-700 border border-red-200' if hata else 'bg-emerald-50 text-emerald-800 border border-emerald-200' }}">
                {{ mesaj }}
            </div>
            {% endif %}

            <form action="/hiz/bildir" method="POST" class="space-y-4">

                <!-- 1. MAKİNE -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">1. Makine Seçiniz</label>
                    <select id="makineSelect" name="makine" required class="w-full px-3.5 py-3 rounded-xl border border-slate-300 bg-white text-slate-800 font-bold text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">-- Makine Seçin --</option>
                    </select>
                </div>

                <!-- 2. OPERASYON -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">2. Operasyon</label>
                    <select id="operasyonSelect" name="operasyon" required disabled class="w-full px-3.5 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 font-bold text-sm disabled:opacity-60 focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">-- Önce Makine Seçin --</option>
                    </select>
                </div>

                <!-- 3. MAMÜL (KABLO) ARAMA VE SEÇİM -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">3. Mamül (Kablo) Adı</label>
                    <input type="text" id="mamulAra" placeholder="🔍 Hızlı ara (örn: 3x2,5 veya NYM)..." disabled class="w-full px-3.5 py-2 mb-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 disabled:opacity-50 focus:border-amber-500 outline-none">
                    <select id="mamulSelect" name="mamul_adi" required disabled class="w-full px-3.5 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 font-bold text-sm disabled:opacity-60 focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">-- Önce Operasyon Seçin --</option>
                    </select>
                </div>

                <!-- GİZLİ REFERANS ALANLARI -->
                <input type="hidden" name="sistem_hizi" id="sistemHiziInput" value="">
                <input type="hidden" name="erp_hizi" id="erpHiziInput" value="">

                <!-- REFERANS HIZ KARTI -->
                <div id="hizBilgiKarti" class="hidden rounded-xl bg-slate-50 border border-slate-200 p-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="block text-[11px] font-bold uppercase tracking-wide text-blue-700">ERP Rota Hızı</span>
                            <span id="erpHizGosterge" class="text-2xl font-black font-mono text-blue-800">-</span>
                        </div>
                        <div class="text-right">
                            <span class="block text-[11px] text-slate-400">2 Yıllık Ort. Hız</span>
                            <span id="ikiYillikHizGosterge" class="text-sm font-mono font-medium text-slate-400">-</span>
                        </div>
                    </div>
                </div>

                <!-- 4. SAHADAKİ HIZ -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">4. Sahadaki Güncel Hız</label>
                    <input type="text" inputmode="decimal" id="sahadakiHizInput" name="sahadaki_hiz" required placeholder="Örn: 620" class="w-full px-4 py-3.5 rounded-xl border-2 border-slate-300 text-lg font-mono font-black text-slate-900 focus:border-amber-500 outline-none">
                </div>

                <!-- CANLI YÜZDE FARK UYARI KUTUSU (FORM GÖNDERİLMEDEN ANLIK ÇALIŞIR) -->
                <div id="canliFarkKutusu" class="hidden p-4 rounded-xl border text-center transition-all">
                    <div id="canliFarkBaslik" class="text-base font-black"></div>
                    <div id="canliFarkDetay" class="text-xs font-medium mt-1 opacity-90"></div>
                </div>

                <!-- 5. AÇIKLAMA -->
                <div>
                    <label id="aciklamaLabel" class="block text-xs font-bold text-slate-700 uppercase mb-1">5. Açıklama (Opsiyonel)</label>
                    <textarea id="aciklamaInput" name="aciklama" rows="2" placeholder="Yavaşlama sebebi, malzeme durumu, vardiya notu..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-800 focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-950 font-black py-4 rounded-xl text-base shadow-sm transition">
                    Hızı Kaydet
                </button>
            </form>
        </div>
    </div>

    <script>
        const KATALOG = {{ katalog | tojson | safe }};

        const makineSelect = document.getElementById("makineSelect");
        const operasyonSelect = document.getElementById("operasyonSelect");
        const mamulAra = document.getElementById("mamulAra");
        const mamulSelect = document.getElementById("mamulSelect");

        const sistemHiziInput = document.getElementById("sistemHiziInput");
        const erpHiziInput = document.getElementById("erpHiziInput");
        const hizBilgiKarti = document.getElementById("hizBilgiKarti");
        const erpHizGosterge = document.getElementById("erpHizGosterge");
        const ikiYillikHizGosterge = document.getElementById("ikiYillikHizGosterge");

        const sahadakiHizInput = document.getElementById("sahadakiHizInput");
        const canliFarkKutusu = document.getElementById("canliFarkKutusu");
        const canliFarkBaslik = document.getElementById("canliFarkBaslik");
        const canliFarkDetay = document.getElementById("canliFarkDetay");
        const aciklamaLabel = document.getElementById("aciklamaLabel");
        const aciklamaInput = document.getElementById("aciklamaInput");

        let aktifMamulListesi = [];

        // Benzersiz makineleri doldur
        const makineler = [...new Set(KATALOG.map(x => x.makine).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr'));
        makineler.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.textContent = m;
            makineSelect.appendChild(opt);
        });

        makineSelect.addEventListener("change", () => {
            const seciliMakine = makineSelect.value;
            operasyonSelect.innerHTML = '<option value="">-- Operasyon Seçin --</option>';
            mamulSelect.innerHTML = '<option value="">-- Önce Operasyon Seçin --</option>';
            mamulSelect.disabled = true;
            mamulAra.value = "";
            mamulAra.disabled = true;
            hizBilgiKarti.classList.add("hidden");
            canliFarkKutusu.classList.add("hidden");
            sistemHiziInput.value = "";
            erpHiziInput.value = "";

            if (!seciliMakine) {
                operasyonSelect.disabled = true;
                return;
            }

            const operasyonlar = [...new Set(
                KATALOG.filter(x => x.makine === seciliMakine).map(x => x.operasyon).filter(Boolean)
            )].sort((a, b) => a.localeCompare(b, 'tr'));

            operasyonlar.forEach(op => {
                const opt = document.createElement("option");
                opt.value = op;
                opt.textContent = op;
                operasyonSelect.appendChild(opt);
            });
            operasyonSelect.disabled = false;
            operasyonSelect.classList.remove("bg-slate-50");
        });

        function mamulListesiniDoldur(filtre = "") {
            const aranan = filtre.trim().toLocaleLowerCase('tr-TR');
            mamulSelect.innerHTML = '<option value="">-- Mamül (Kablo) Seçin --</option>';

            const suzulmus = aranan
                ? aktifMamulListesi.filter(item => item.mamul.toLocaleLowerCase('tr-TR').includes(aranan))
                : aktifMamulListesi;

            suzulmus.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.mamul;
                opt.textContent = item.mamul;
                opt.dataset.hiz = item.hiz || "";
                opt.dataset.erp = item.erp_hiz || "";
                mamulSelect.appendChild(opt);
            });

            if (suzulmus.length === 1 && aranan) {
                mamulSelect.selectedIndex = 1;
                mamulSecildi();
            }
        }

        operasyonSelect.addEventListener("change", () => {
            const seciliMakine = makineSelect.value;
            const seciliOp = operasyonSelect.value;
            mamulAra.value = "";
            hizBilgiKarti.classList.add("hidden");
            canliFarkKutusu.classList.add("hidden");
            sistemHiziInput.value = "";
            erpHiziInput.value = "";

            if (!seciliOp) {
                mamulSelect.innerHTML = '<option value="">-- Önce Operasyon Seçin --</option>';
                mamulSelect.disabled = true;
                mamulAra.disabled = true;
                return;
            }

            aktifMamulListesi = KATALOG
                .filter(x => x.makine === seciliMakine && x.operasyon === seciliOp && x.mamul)
                .sort((a, b) => a.mamul.localeCompare(b.mamul, 'tr'));

            mamulListesiniDoldur();
            mamulSelect.disabled = false;
            mamulSelect.classList.remove("bg-slate-50");
            mamulAra.disabled = false;
            mamulAra.classList.remove("bg-slate-50");
        });

        mamulAra.addEventListener("input", () => {
            mamulListesiniDoldur(mamulAra.value);
        });

        function mamulSecildi() {
            const seciliOpt = mamulSelect.options[mamulSelect.selectedIndex];
            if (!seciliOpt || !seciliOpt.value) {
                hizBilgiKarti.classList.add("hidden");
                sistemHiziInput.value = "";
                erpHiziInput.value = "";
                canliFarkKutusu.classList.add("hidden");
                return;
            }

            const ikiYillik = seciliOpt.dataset.hiz || "";
            const erpHiz = seciliOpt.dataset.erp || "";

            sistemHiziInput.value = ikiYillik;
            erpHiziInput.value = erpHiz;

            erpHizGosterge.textContent = erpHiz ? `${erpHiz}` : "Tanımsız";
            ikiYillikHizGosterge.textContent = ikiYillik ? `${ikiYillik}` : "-";
            hizBilgiKarti.classList.remove("hidden");

            hesaplaCanliFark();
        }

        mamulSelect.addEventListener("change", mamulSecildi);

        function hesaplaCanliFark() {
            const rawSaha = sahadakiHizInput.value.trim().replace(",", ".");
            const rawErp = erpHiziInput.value.trim().replace(",", ".");

            const sahaSayi = parseFloat(rawSaha);
            const erpSayi = parseFloat(rawErp);

            if (isNaN(sahaSayi) || rawSaha === "") {
                canliFarkKutusu.classList.add("hidden");
                aciklamaLabel.textContent = "5. Açıklama (Opsiyonel)";
                aciklamaLabel.className = "block text-xs font-bold text-slate-700 uppercase mb-1";
                aciklamaInput.classList.remove("border-red-400", "bg-red-50/40");
                return;
            }

            if (isNaN(erpSayi) || erpSayi <= 0) {
                canliFarkKutusu.className = "p-3.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 text-center";
                canliFarkBaslik.textContent = "ℹ️ Bu ürün için ERP rota hızı tanımlı değil";
                canliFarkDetay.textContent = "Yüzde kıyaslaması yapılamıyor, doğrudan kaydedebilirsiniz.";
                canliFarkKutusu.classList.remove("hidden");
                return;
            }

            const farkYuzde = ((sahaSayi - erpSayi) / erpSayi) * 100;
            const mutlakYuzde = Math.abs(farkYuzde).toFixed(1);

            if (farkYuzde < -0.05) {
                // DÜŞÜK HIZ UYARISI
                canliFarkKutusu.className = "p-4 rounded-xl border-2 border-red-300 bg-red-50 text-red-800 text-center";
                canliFarkBaslik.textContent = `⚠️ ROTADAKİ HIZDAN %${mutlakYuzde} DÜŞÜK`;
                canliFarkDetay.textContent = `ERP Hızı: ${erpSayi} → Girilen Hız: ${sahaSayi} (${(sahaSayi - erpSayi).toFixed(1).replace('.0', '')} fark)`;
                canliFarkKutusu.classList.remove("hidden");

                aciklamaLabel.textContent = "5. Açıklama (Düşük Hız Sebebini Yazınız)";
                aciklamaLabel.className = "block text-xs font-bold text-red-700 uppercase mb-1";
                aciklamaInput.classList.add("border-red-400", "bg-red-50/40");
            } else if (farkYuzde > 0.05) {
                // YÜKSEK HIZ BİLGİSİ
                canliFarkKutusu.className = "p-4 rounded-xl border-2 border-emerald-300 bg-emerald-50 text-emerald-800 text-center";
                canliFarkBaslik.textContent = `✅ ROTADAKİ HIZDAN %${mutlakYuzde} YÜKSEK`;
                canliFarkDetay.textContent = `ERP Hızı: ${erpSayi} → Girilen Hız: ${sahaSayi} (+${(sahaSayi - erpSayi).toFixed(1).replace('.0', '')} fark)`;
                canliFarkKutusu.classList.remove("hidden");

                aciklamaLabel.textContent = "5. Açıklama (Opsiyonel)";
                aciklamaLabel.className = "block text-xs font-bold text-slate-700 uppercase mb-1";
                aciklamaInput.classList.remove("border-red-400", "bg-red-50/40");
            } else {
                // TAM HEDEF HIZ
                canliFarkKutusu.className = "p-4 rounded-xl border-2 border-blue-300 bg-blue-50 text-blue-800 text-center";
                canliFarkBaslik.textContent = `🎯 ROTADAKİ HIZ İLE AYNI (%0)`;
                canliFarkDetay.textContent = `ERP Hızı: ${erpSayi} → Girilen Hız: ${sahaSayi}`;
                canliFarkKutusu.classList.remove("hidden");

                aciklamaLabel.textContent = "5. Açıklama (Opsiyonel)";
                aciklamaLabel.className = "block text-xs font-bold text-slate-700 uppercase mb-1";
                aciklamaInput.classList.remove("border-red-400", "bg-red-50/40");
            }
        }

        sahadakiHizInput.addEventListener("input", hesaplaCanliFark);
    </script>
</body>
</html>
